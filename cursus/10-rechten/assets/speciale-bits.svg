" y="128.1" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="800" fill="#94a3b8">0</text><text x="631.0" y="162.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#475569">anderen</text><text x="403.0" y="76.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#94a3b8">som</text><path d="M24 190 H736" stroke="#e5ebf3" stroke-width="1.6"/><text x="24.0" y="228.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748b">ls -ld toont:</text><rect x="150" y="206" width="190" height="34" rx="9" fill="#0f172a"/><text x="164" y="229" xml:space="preserve" font-family="ui-monospace,'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="700" fill="#e2e8f0">drwx<tspan fill="#fde68a">r</tspan><tspan fill="#fde68a">w</tspan><tspan fill="#fdba74">s</tspan>--<tspan fill="#fdba74">T</tspan></text><text x="360.0" y="222.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#6b4a06">s bij de groep: setgid staat aan, de x eronder ook</text><text x="360.0" y="242.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#6b4a06">T bij anderen: sticky staat aan, maar de x eronder staat uit</text><path d="M24 262 H736" stroke="#e5ebf3" stroke-width="1.6"/><text x="24.0" y="292.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#64748b">Kleine letter (s, t): x staat ook aan.  Hoofdletter (S, T): x staat uit.</text><text x="24.0" y="314.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#64748b">Alle speciale bits wissen: zet een extra nul voor de modus (chmod 00770).</text></svg>